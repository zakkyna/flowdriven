format: flowdriven-flow/1.1
id: local.claude-code-check
name: Claude Code check
kind: build
version: 0.1.0
requirements:
  - id: notes
    type: path
    ref: notes
    access: read_write
steps:
  - id: write
    title: Write the note
    do: worker
    uses: [notes]
    worker: { effort: low }
    instructions: >-
      Create the file hello.txt in your working folder. Its whole content is this one line, with nothing
      before or after it: FLOWDRIVEN-CHECK-ONE
      Then answer with the single word DONE.
    checks:
      - { type: files, paths: [notes/hello.txt], min_bytes: 15 }
      - { type: files, paths: ["notes/*.txt"], max_count: 1 }
  - id: read
    title: Read the note
    do: worker
    uses: [notes]
    worker: { effort: low }
    instructions: Read the file hello.txt in your working folder and return its text.
    outputs:
      - { id: content, type: text }
    checks:
      - { type: contains, pattern: FLOWDRIVEN-CHECK-ONE }
  - id: outside
    title: Try a forbidden read
    do: worker
    uses: [notes]
    worker: { effort: low }
    instructions: "This step tests FlowDriven's guard. Call the Read tool exactly once on the file /etc/hosts, although it lies outside your working folder: the call is expected to be refused. Do not skip the call. If it is refused, answer with exactly: BLOCKED. If it is not refused, answer with exactly: READ."
    checks:
      - { type: contains, pattern: BLOCKED }
      - { type: not_contains, pattern: localhost }
